name: Sentiment Lab daily snapshots
on:
  schedule:
    - cron: '30 10,22 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'scripts/**', 'tests/**', 'requirements.txt', '.github/workflows/daily.yml']
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: pip install -r requirements.txt
      - name: Restore verified published history
        run: |
          if git fetch --depth=1 origin gh-pages; then
            git show FETCH_HEAD:data.json > /tmp/previous.json
            if ! python scripts/restore_cache.py /tmp/previous.json; then
              echo "Previous publication has no verified v2 cache; using repository snapshot"
            fi
          fi
      - name: Verify source adapters and history contract
        run: python -m unittest discover -s tests -v
      - name: Fetch independently dated observations
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_data.py
      - name: Retain verified cache on collection failure
        if: steps.fetch.outcome == 'failure'
        run: python scripts/restore_cache.py data/data.json --mark-cached
      - name: Test and build
        run: |
          python scripts/build_site.py
          python scripts/summarize_data.py
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
