name: 📊 市场情绪看板 — Daily Update

on:
  schedule:
    - cron: '30 10 * * 1-5'   # 工作日 18:30 CST (10:30 UTC)
  workflow_dispatch:           # 支持手动触发

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install akshare pandas requests --quiet

      - name: 📡 Fetch Data
        id: fetch
        continue-on-error: true
        run: |
          echo "开始采集数据..."
          python scripts/fetch_data.py 2>&1
          echo "fetch_exit=$?" >> $GITHUB_OUTPUT

      - name: 🔄 Fallback — 生成模拟数据
        if: steps.fetch.outputs.fetch_exit != '0' || !success()
        run: |
          echo "⚠️ 数据采集失败，使用模拟数据兜底"
          python scripts/fetch_data.py --mock 2>&1

      - name: 🏗️ Build Site
        run: |
          python scripts/build_site.py 2>&1
          echo "✅ 站点构建完成"

      - name: 📤 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          full_commit_message: "deploy: 每日数据更新 ${{ github.event.repository.updated_at }} [skip ci]"
          user_name: "market-bot"
          user_email: "bot@market-sentiment.io"
